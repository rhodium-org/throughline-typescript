uid: SR-0040
type: system_requirement
status: approved
title: Throw only Error instances
text: >-
  Always instantiate an exception with new Error() or a subclass; never throw an arbitrary
  value, and assume every caught error is an Error instance.
links:
- target: UR-0006
  type: implements
attrs:
  source_ref: "Google TS Style Guide: Language Features — Control Structures — Exception Handling"
