uid: SR-0031
type: system_requirement
status: proposed
title: Prefer function declarations for named functions
text: Prefer a function declaration over an arrow function or function expression
  for a named function, unless an explicit type annotation is required.
normative: true
links:
- target: UR-0005
  type: implements
