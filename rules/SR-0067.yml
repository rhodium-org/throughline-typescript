uid: SR-0067
type: system_requirement
status: approved
title: Do not suppress type errors
text: >-
  Do not use @ts-ignore, @ts-expect-error or @ts-nocheck to suppress a type error, except
  very rarely @ts-expect-error in a unit test.
links:
- target: UR-0011
  type: implements
