uid: SR-0052
type: system_requirement
status: proposed
title: Do not use underscore affixes or opt_ prefixes
text: 'Do not use a leading or trailing underscore on an identifier, the opt_ prefix
  for optional parameters, or a JavaScript private #identifier.'
normative: true
