uid: SR-0052
type: system_requirement
status: approved
title: Do not use underscore affixes or opt_ prefixes
text: >-
  Do not use a leading or trailing underscore on an identifier, the opt_ prefix for
  optional parameters, or a JavaScript private #identifier.
links:
- target: UR-0008
  type: implements
attrs:
  source_ref: "Google TS Style Guide: Naming — Identifiers"
