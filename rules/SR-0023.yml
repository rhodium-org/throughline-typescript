uid: SR-0023
type: system_requirement
status: approved
title: Omit an empty or purely delegating constructor
text: >-
  Do not write an empty constructor or one that only delegates to the parent; ES2015
  provides a default. Keep a constructor that declares parameter properties or visibility
  modifiers.
links:
- target: UR-0004
  type: implements
attrs:
  source_ref: "Google TS Style Guide: Language Features — Classes — Constructors"
