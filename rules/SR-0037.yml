uid: SR-0037
type: system_requirement
status: proposed
title: Always brace control-flow blocks
text: Always use a braced block for the body of an if, else, for, do or while statement,
  except a simple if that fits on one line.
normative: true
links:
- target: UR-0006
  type: implements
