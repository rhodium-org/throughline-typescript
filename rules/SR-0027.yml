uid: SR-0027
type: system_requirement
status: approved
title: Limit visibility and never use a redundant public modifier
text: >-
  Limit each symbol's visibility as far as possible, and never use the public modifier
  except when declaring a non-readonly public parameter property.
links:
- target: UR-0004
  type: implements
attrs:
  source_ref: "Google TS Style Guide: Language Features — Classes — Visibility"
