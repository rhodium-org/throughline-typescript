uid: SR-0054
type: system_requirement
status: approved
title: Rely on inference for trivial types
text: >-
  Rely on the compiler's inference for a trivially inferred type, and add a type
  annotation only where it improves readability of a complex expression.
links:
- target: UR-0009
  type: implements
attrs:
  source_ref: "Google TS Style Guide: Type System — Type Inference"
