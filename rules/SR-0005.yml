uid: SR-0005
type: system_requirement
status: proposed
title: Order file contents and separate sections with one blank line
text: Order a file's contents as copyright, then the @fileoverview JSDoc, then imports,
  then the implementation, separating each present section with exactly one blank
  line.
normative: true
links:
- target: UR-0002
  type: implements
attrs:
  source_ref: 'Google TS Style Guide: Source File Structure'
