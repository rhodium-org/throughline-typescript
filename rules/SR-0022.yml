uid: SR-0022
type: system_requirement
status: approved
title: Do not end a class declaration with a semicolon
text: >-
  Do not terminate a class declaration with a semicolon, but do terminate a statement that
  contains a class expression.
links:
- target: UR-0004
  type: implements
attrs:
  source_ref: "Google TS Style Guide: Language Features — Classes — Class Declarations"
