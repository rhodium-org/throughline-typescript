uid: SR-0006
type: system_requirement
status: approved
title: Use ES module syntax exclusively
text: >-
  Use ES module import and export syntax exclusively; do not use the namespace construct,
  import-require, or /// <reference> directives.
links:
- target: UR-0002
  type: implements
attrs:
  source_ref: "Google TS Style Guide: Source File Structure — Modules not Namespaces"
