uid: SR-0061
type: system_requirement
status: approved
title: Prefer Map, Set and Record to index-signature objects
text: >-
  Consider Map and Set instead of an object with an index signature, and use Record<Keys,
  Value> for an object with a known set of keys.
links:
- target: UR-0009
  type: implements
attrs:
  source_ref: "Google TS Style Guide: Type System — Indexable Types"
