uid: SR-0011
type: system_requirement
status: proposed
title: Do not use container classes of static members for namespacing
text: Do not create a container class of static methods or properties purely to namespace
  them; export the individual constants and functions instead.
normative: true
links:
- target: UR-0002
  type: implements
attrs:
  source_ref: 'Google TS Style Guide: Source File Structure — Exports'
