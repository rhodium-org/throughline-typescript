uid: SR-0051
type: system_requirement
status: approved
title: Treat acronyms as whole words when casing
text: >-
  Treat an abbreviation or acronym as a whole word when casing a name, writing loadHttpUrl
  rather than loadHTTPURL.
links:
- target: UR-0008
  type: implements
attrs:
  source_ref: "Google TS Style Guide: Naming — Camel Case"
