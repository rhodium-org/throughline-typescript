uid: SR-0010
type: system_requirement
status: proposed
title: Do not export mutable bindings with export let
text: Do not use export let for a mutable binding; expose an explicit getter function
  for any externally readable mutable value.
normative: true
links:
- target: UR-0002
  type: implements
attrs:
  source_ref: 'Google TS Style Guide: Source File Structure — Exports'
