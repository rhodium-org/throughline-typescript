uid: SR-0060
type: system_requirement
status: proposed
title: Use lowercase primitive types, never wrapper types
text: Never use the wrapper types String, Boolean, Number or Object; use the lowercase
  primitives, and use object to mean any non-primitive.
normative: true
links:
